name = "vault-sync"
main = "vault-sync.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "VAULT_KV"
id = "dadc5158a42140c2a1c210a9ee28ccec"

[vars]
# 允许跨域读写的前端来源（英文逗号分隔，精确匹配，不要结尾斜杠）。
# 漏掉某个来源，该站点在浏览器里就会出现「上传/拉取静默失败」（CORS 被拦，curl 测不出来）。
#   nav.yongjiu.ccwu.cc        完整版自定义域
#   lite1-3d8c30u.maozi.io     完整版帽子云
#   lite-3d8c30u.maozi.io      兼容版帽子云
#   xdd2024030565-spec.github.io  GitHub Pages
ALLOW_ORIGIN = "https://nav.yongjiu.ccwu.cc,https://lite1-3d8c30u.maozi.io,https://lite-3d8c30u.maozi.io,https://xdd2024030565-spec.github.io"
# SYNC_KEY 建议用 `wrangler secret put SYNC_KEY` 单独设置，不要写进 toml

# 已配置自定义域路由（通过 Cloudflare Dashboard/API 添加）：
# vault-sync.yongjiu.ccwu.cc/* -> vault-sync
# 如需修改，请在 Cloudflare Dashboard → Workers & Pages → vault-sync → Settings → Domains & Routes 中操作