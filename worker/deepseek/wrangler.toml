name = "deepseek-web"
main = "deepseek-web.js"
compatibility_date = "2024-11-01"

# PoW 求解用官方 sha3_wasm_bg.wasm（DeepSeekHashV1，与网页端同源算法）。
# Workers 的模块规则：把 .wasm 作为 ES 模块导入（代码里是
# import wasmModule from './sha3_wasm_bg.wasm'）——注意这是**部署时预编译**，
# 不是运行时编译 WASM，因此 Workers 允许。
#
# ⚠️ 曾经改成「纯 JS SHA3 + 自判阈值」，结果服务端一律回 40301 INVALID_POW_RESPONSE
#    （官方在 WASM 内部按特定方式打包 challenge 与前缀，外部复刻不出来），
#    所以这里必须保留 WASM 方案。
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[vars]
# 允许跨域的前端来源（英文逗号分隔；* 表示任意站点，不推荐）
ALLOW_ORIGIN = "https://nav.yongjiu.ccwu.cc,https://lite1-3d8c30u.maozi.io,https://xdd2024030565-spec.github.io,https://lite-3d8c30u.maozi.io"
# 深度思考开关：auto（按 model 名判断）/ enabled / disabled
THINKING = "auto"
# 联网搜索开关：auto / enabled / disabled
SEARCH = "auto"

# ===== token 的两种来源（任选其一即可用）=====
#  ① 推荐：放进 Worker secret，token 不会出现在浏览器里
#       wrangler secret put DEEPSEEK_TOKENS   # 多个用英文逗号分隔
#     GitHub Actions 部署时读的是仓库 secret「DEEPSEEK_TOKEN」。
#  ② 兜底：不配 secret，前端把网页版 token 填进
#       「DeepSeek 网页版」提供商的 API Key 字段 —— Worker 会从
#       Authorization: Bearer <token> 里取用，改完即生效、无需重新部署。
#
# 可选访问口令（配了则前端 Key 必须填它）：
#   wrangler secret put PROXY_KEY

# 部署后在 Cloudflare Dashboard 添加自定义域路由：
#   deepseek-web.yongjiu.ccwu.cc/*  ->  deepseek-web
# 该域名需与 ai.html 里的 DS_WEB_BASE 一致：
#   const DS_WEB_BASE = 'https://deepseek-web.yongjiu.ccwu.cc/v1';
#
# 健康检查（部署后先跑这个确认）：
#   curl https://deepseek-web.yongjiu.ccwu.cc/health
#   期望：{"status":"ok","service":"deepseek-web","runtime":"pure-js-sha3","tokenSource":"secret"|"header"|"none",...}
