name: Set Worker Secret

# 一次性工具：把仓库 secret 写进 Worker 的加密变量，值不进仓库也不进日志。
on:
  workflow_dispatch:
    inputs:
      name:
        description: Worker secret 名称（如 GROK_TOKENS）
        required: true
        default: GROK_TOKENS

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Push secret to Worker
        working-directory: worker/deepseek
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          NAME: ${{ inputs.name }}
          VALUE: ${{ secrets.GROK_TOKENS }}
        run: |
          if [ -z "$VALUE" ]; then echo "仓库里没有对应的 secret，先在 GitHub 添加"; exit 1; fi
          echo "--- 直接调 Workers API 写 secret（看真实返回）---"
          curl -sS -m 25 -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "name=$NAME" -F "text=$VALUE" -F "type=secret_text" \
            "https://api.cloudflare.com/client/v4/accounts/b9865b22dc4d641747133c293e700f/workers/scripts/deepseek-web/secrets" \
            | head -c 400
          echo
