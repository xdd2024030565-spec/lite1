name: Set Worker Secret

# 一次性工具：把仓库 secret 写进 Worker 的加密变量，值不进仓库也不进日志。
on:
  workflow_dispatch:
    inputs:
      name:
        description: Worker secret 名称（如 GROK_TOKENS）
        required: true
        default: GROK_TOKENS

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Push secret to Worker
        working-directory: worker/deepseek
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || 'b9865b22dc4d641747133c293e700f' }}
          NAME: ${{ inputs.name }}
          VALUE: ${{ secrets.GROK_TOKENS }}
        run: |
          if [ -z "$VALUE" ]; then echo "仓库里没有对应的 secret，先在 GitHub 添加"; exit 1; fi
          echo "账号: ${CLOUDFLARE_ACCOUNT_ID}"
          echo "--- 账号下可见的 Worker 脚本 ---"
          curl -sS -m 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            | head -c 600 || true
          echo
          printf '%s' "$VALUE" | npx --yes wrangler@3 secret put "$NAME" --name deepseek-web
