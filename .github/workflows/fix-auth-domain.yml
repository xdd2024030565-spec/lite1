name: Fix Auth Domain

on:
  push:
    paths:
      - '.github/workflows/fix-auth-domain.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          sed -i 's|auth-api\.xdd2024030565\.workers\.dev|auth-api.yongjiu.ccwu.cc|g' index.html
          echo '--- AUTH_API lines now ---'
          grep -n 'var AUTH_API=' index.html
          wc -c index.html

      - name: Commit and push
        run: |
          git config user.name "xdd-fix-bot"
          git config user.email "xdd-fix-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "NO_CHANGE"
          else
            git commit -m "fix: switch AUTH_API to auth-api.yongjiu.ccwu.cc (login network error)"
            git push origin HEAD:main
            echo "PUSHED_OK"
          fi
