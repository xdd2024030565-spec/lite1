<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 工具箱</title>
<style>
:root{--bg:#f4f6f8;--bg2:#fff;--fg:#1d1d1f;--fg2:#6e6e73;--border:#e4e6ea;--accent:#2563eb;--accent2:#1d4ed8;--accent-bg:#eef4ff;--danger:#dc2626;--ok:#16a34a;--card:#fff;--radius:14px;--shadow:0 8px 30px rgba(15,23,42,.08);--ease:cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#0b0d10;--bg2:#161a20;--fg:#f3f4f6;--fg2:#9ca3af;--border:#2a3038;--accent:#3b82f6;--accent2:#2563eb;--accent-bg:rgba(59,130,246,.16);--danger:#f87171;--ok:#4ade80;--card:#161a20;--shadow:0 10px 32px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#0b0d10;--bg2:#161a20;--fg:#f3f4f6;--fg2:#9ca3af;--border:#2a3038;--accent:#3b82f6;--accent2:#2563eb;--accent-bg:rgba(59,130,246,.16);--danger:#f87171;--ok:#4ade80;--card:#161a20;--shadow:0 10px 32px rgba(0,0,0,.35)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;font-size:15px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
input,select,textarea{font-size:14px;background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:10px 12px;outline:none;width:100%;transition:border .15s var(--ease),box-shadow .15s var(--ease)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--fg);font-size:13px;font-weight:600;transition:all .15s var(--ease);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn.danger{color:var(--danger);border-color:transparent;background:rgba(220,38,38,.08)}
.btn.small{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.topbar{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(16px);flex-shrink:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:16px;flex-shrink:0}
.brand h1{font-size:16px;font-weight:750;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--fg2);font-weight:500;margin-top:-2px}
.topbar .sp{flex:1}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:300px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-scroll{flex:1;overflow-y:auto;padding:12px}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
.panel h3{font-size:12px;font-weight:700;color:var(--fg2);letter-spacing:.04em;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.panel h3 .sp{flex:1}
.session-list{max-height:240px;overflow-y:auto}
.session-item,.provider-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;border:1px solid transparent;margin-bottom:4px}
.session-item:hover,.provider-item:hover{background:var(--accent-bg)}
.session-item.active,.provider-item.active{background:var(--accent-bg);border-color:var(--accent)}
.session-item .t,.provider-item .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-item .del{opacity:.35;color:var(--fg2);border:0;background:transparent;padding:2px 4px}
.session-item:hover .del{opacity:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
.provider-item.off .dot{background:var(--fg2)}
.model-sel{margin-top:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 92%,var(--accent)))}
.msgs{flex:1;overflow-y:auto;padding:24px 18px 12px}
.msg{max-width:820px;margin:0 auto 16px;display:flex;flex-direction:column}
.msg .role{font-size:11px;font-weight:700;color:var(--fg2);margin:0 4px 5px;letter-spacing:.06em}
.msg .bubble{padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--border);line-height:1.75;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.msg.user{align-items:flex-end}
.msg.user .bubble{background:var(--accent);color:#fff;border-color:transparent}
.msg .tool-call{margin-top:6px;font-size:12px;color:var(--fg2);background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:7px 10px;font-family:ui-monospace,monospace;overflow-x:auto}
.bubble pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:8px 0;font-size:13px}
.bubble code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:.92em}
.inputbar{padding:12px 18px 16px}
.inputwrap{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
#input{border:0;background:transparent;resize:none;max-height:160px;padding:8px 0;box-shadow:none}
#input:focus{box-shadow:none}
.send-btn{width:40px;height:40px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;flex-shrink:0}
.send-btn:disabled{opacity:.45}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal-mask.open{display:flex}
.modal{width:min(640px,100%);max-height:min(88dvh,860px);overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.modal h2{font-size:18px;margin-bottom:4px}
.modal .sub{color:var(--fg2);font-size:12px;margin-bottom:14px}
.tabs{display:flex;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--fg2);border-radius:9px;padding:7px 8px;font-size:13px;font-weight:650}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab-pane{display:none}
.tab-pane.on{display:block}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;font-weight:650;color:var(--fg2);margin-bottom:6px}
.hint{font-size:12px;color:var(--fg2);margin-top:6px;line-height:1.5}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-weight:650}
.tool-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.tool-item .n{flex:1}
.switch{position:relative;width:36px;height:20px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#c7c7cc;border-radius:20px}
.slider:before{content:"";position:absolute;height:16px;width:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+.slider{background:var(--ok)}
.switch input:checked+.slider:before{transform:translateX(16px)}
.empty{max-width:520px;margin:12vh auto;text-align:center;color:var(--fg2)}
.empty .big{font-size:42px;margin-bottom:8px}
.empty h2{color:var(--fg);font-size:22px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:90;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.menu-btn,.sidebar-backdrop{display:none}
@media(max-width:860px){
 .menu-btn{display:inline-flex}
 .sidebar{position:fixed;inset:58px auto 0 0;z-index:70;transform:translateX(-105%);width:min(86vw,320px)}
 .sidebar.open{transform:none}
 .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;opacity:0;pointer-events:none}
 .sidebar-backdrop.open{opacity:1;pointer-events:auto}
 .brand small{display:none}
}
</style>
<body>
<div class="topbar">
  <button class="btn menu-btn" id="menuBtn" aria-label="菜单">☰</button>
  <div class="brand"><span class="logo">✦</span><div><h1>AI 工具箱</h1><small>多模型 · 流式对话 · 工具与插件</small></div></div>
  <span class="chip" id="statusChip">未配置</span>
  <span class="sp"></span>
  <button class="btn small" id="btnNew">新对话</button>
  <button class="btn small" id="btnSettings">设置</button>
</div>
<div class="layout">
  <div class="sidebar-backdrop" id="sbBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-scroll">
      <section class="panel">
        <h3>对话<span class="sp"></span><button class="btn small" id="btnNew2">＋</button></h3>
        <div class="session-list" id="sessionList"></div>
      </section>
      <section class="panel">
        <h3>模型<span class="sp"></span><button class="btn small" id="btnAddProvider">添加</button></h3>
        <div id="providerList"></div>
        <select class="model-sel" id="modelSel"></select>
      </section>
      <section class="panel">
        <h3>能力</h3>
        <button class="btn small" style="width:100%" id="btnManageTools">管理工具、MCP 与插件</button>
        <div id="toolStatus" style="margin-top:8px"></div>
      </section>
    </div>
  </aside>
  <main class="main">
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <div class="inputwrap">
        <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" title="发送">➤</button>
        <button class="send-btn" id="stopBtn" title="停止生成" style="display:none;background:var(--danger)">■</button>
      </div>
    </div>
  </main>
</div>


<div class="modal-mask" id="providerModal">
  <div class="modal">
    <h2 id="providerModalTitle">添加提供商</h2>
    <p class="sub">填写 OpenAI 兼容接口。商汤、OpenAI 等会自动经代理访问。</p>
    <div class="tabs"><button type="button" class="on" data-tab="p-basic">连接</button><button type="button" data-tab="p-model">模型</button><button type="button" data-tab="p-adv">高级</button></div>
    <div class="tab-pane on" id="p-basic">
      <div class="form-row"><label>常用模板</label><select id="pTemplate"><option value="">自定义</option><option value="sensenova">商汤 SenseNova</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="google">Google Gemini</option><option value="qwen">通义千问</option><option value="moonshot">Kimi</option><option value="zhipu">智谱</option><option value="doubao">豆包</option><option value="ollama">Ollama（本地）</option><option value="openrouter">OpenRouter</option><option value="groq">Groq</option></select></div>
      <div class="form-row"><label>名称</label><input id="pName" placeholder="例如：商汤日日新"></div>
      <div class="form-row"><label>API 地址</label><input id="pBase" placeholder="https://token.sensenova.cn/v1"><div class="hint">程序会自动拼接 /chat/completions。</div></div>
      <div class="form-row"><label>API Key</label><input id="pKey" type="password" placeholder="sk-..."></div>
    </div>
    <div class="tab-pane" id="p-model">
      <div class="form-row"><label>模型（逗号分隔）</label><input id="pModels" placeholder="sensenova-6.8-flash-lite, deepseek-v4-flash"></div>
      <div class="form-row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn small" id="btnFetchModels" type="button">拉取模型</button><button class="btn small" id="btnTestConn" type="button">测试连接</button><span id="fetchModelsStatus" class="hint" style="margin:0"></span></div>
      <div class="form-row"><label>默认系统提示词</label><textarea id="pSys" rows="3" placeholder="你是一个有用的 AI 助手"></textarea></div>
    </div>
    <div class="tab-pane" id="p-adv">
      <div class="form-row"><label>专用代理（可选）</label><input id="pProxy" placeholder="留空则使用全局代理或直连"><div class="hint">仅此提供商走该地址。全局代理在设置的网络页配置。</div></div>
    </div>
    <div class="form-actions"><button class="btn danger" id="pDelete" style="display:none;margin-right:auto">删除</button><button class="btn" id="pCancel">取消</button><button class="btn primary" id="pSave">保存</button></div>
  </div>
</div>
<div class="modal-mask" id="toolsModal">
  <div class="modal">
    <h2>能力中心</h2><p class="sub">内置工具、远程 MCP 与 OpenAPI 插件。</p>
    <div class="tabs"><button type="button" class="on" data-tab="t-built">内置</button><button type="button" data-tab="t-mcp">MCP</button><button type="button" data-tab="t-plugin">插件</button></div>
    <div class="tab-pane on" id="t-built"><div id="builtinTools"></div></div>
    <div class="tab-pane" id="t-mcp"><div class="form-actions" style="justify-content:space-between"><span class="hint" style="margin:0">远程 HTTP MCP，仅拉取并调用工具。</span><button class="btn small" id="btnAddMcp">添加</button></div><div id="mcpList"></div></div>
    <div class="tab-pane" id="t-plugin"><div class="form-actions" style="justify-content:space-between"><span class="hint" style="margin:0">支持 OpenAPI 与自定义 JSON 工具。</span><button class="btn small" id="btnAddPlugin">添加</button></div><div id="pluginList"></div></div>
    <div class="form-actions"><button class="btn primary" id="toolsClose">完成</button></div>
  </div>
</div>
<div class="modal-mask" id="mcpModal"><div class="modal"><h2>MCP 服务器</h2><div class="form-row"><label>名称</label><input id="mName" placeholder="例如：GitHub MCP"></div><div class="form-row"><label>地址</label><input id="mUrl" placeholder="https://mcp.example.com/mcp"></div><div class="form-row"><label>Bearer Token（可选）</label><input id="mToken" type="password"></div><div class="form-row"><label>额外 Headers（JSON，可选）</label><input id="mHeaders" placeholder='{"X-Key":"value"}'></div><div class="form-actions"><button class="btn" id="mCancel">��消</button><button class="btn primary" id="mSave">保存并拉取工具</button></div></div></div>
<div class="modal-mask" id="pluginModal"><div class="modal"><h2>添加插件</h2><div class="form-row"><label>名称</label><input id="plName"></div><div class="form-row"><label>类型</label><select id="plType"><option value="openapi">OpenAPI 插件</option><option value="custom">自定义 JSON 工具</option></select></div><div class="form-row"><label>OpenAPI 地址或 JSON</label><textarea id="plOpenapi" rows="4"></textarea></div><div id="customFields" style="display:none"><div class="form-row"><label>工具名称</label><input id="cName"></div><div class="form-row"><label>描述</label><input id="cDesc"></div><div class="form-row"><label>URL</label><input id="cUrl"></div><div class="form-row"><label>方法</label><select id="cMethod"><option>GET</option><option>POST</option></select></div><div class="form-row"><label>Headers（JSON）</label><input id="cHeaders"></div><div class="form-row"><label>参数 JSON Schema</label><textarea id="cSchema" rows="3"></textarea></div></div><div class="form-actions"><button class="btn" id="plCancel">取消</button><button class="btn primary" id="plSave">保存</button></div></div></div>
<div class="modal-mask" id="settingsModal"><div class="modal"><h2>设置</h2><p class="sub">生成参数、网络与数据分开管理。</p><div class="tabs"><button type="button" class="on" data-tab="s-gen">生成</button><button type="button" data-tab="s-net">网络</button><button type="button" data-tab="s-data">数据</button></div><div class="tab-pane on" id="s-gen"><div class="form-row"><label>温度 <span id="tempVal">0.7</span></label><input type="range" id="setTemp" min="0" max="2" step="0.1" value="0.7"></div><div class="form-row"><label>最大 Tokens</label><input type="number" id="setMaxTokens" min="1" max="128000" value="2048"></div></div><div class="tab-pane" id="s-net"><div class="form-row"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="setUseProxy" style="width:auto"> 始终通过代理访问 API</label><div class="hint">已知会被浏览器拦截的接口会自动走代理。</div></div><div class="form-row"><label>代理地址</label><input id="setProxyBase" placeholder="https://ai.yongjiu.ccwu.cc"></div></div><div class="tab-pane" id="s-data"><div class="form-row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="btnExport" type="button">导出配置</button><button class="btn small" id="btnImport" type="button">导入配置</button><button class="btn small danger" id="btnWipe" type="button">清空全部</button></div><div class="hint">导出包含密钥，请妥善保管。</div><input type="file" id="importFile" accept=".json" style="display:none"></div><div class="form-actions"><button class="btn" id="settingsCancel">取消</button><button class="btn primary" id="settingsSave">保存</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
// ====== API 网关选优层（多域名故障转移 + 快捷保留区） ======
// 原理：并发探测多个网关域名，选最快可用者，覆盖 API_BASE/AUTH_API/SEARCH_API
// 支持：localStorage 缓存结果（TTL 10分钟）、手动填入自定义订阅地址（快捷保留区）

(function(){
  // 服务 -> 候选网关域名（按优先级，第一位为默认）
  var GATEWAY_POOL = {
    api:  ["https://api.yongjiu.ccwu.cc", "https://api2.yongjiu.ccwu.cc"],
    auth: ["https://auth-api.yongjiu.ccwu.cc", "https://auth-api2.yongjiu.ccwu.cc"],
    search: ["https://search.yongjiu.ccwu.cc", "https://search2.yongjiu.ccwu.cc"]
  };

  // 快捷保留区：用户可手动填写的备用订阅地址（失效时自动切换到这里）
  function getCustom(service){
    try{ return localStorage.getItem('gw_custom_'+service)||''; }catch(e){ return ''; }
  }
  function setCustom(service, url){
    try{ localStorage.setItem('gw_custom_'+service, url||''); }catch(e){}
  }

  // 健康检查：GET /health 或根路��，3 秒超时
  function test(url){
    return new Promise(function(resolve){
      var ctrl = typeof AbortController!=='undefined' ? new AbortController() : null;
      var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); resolve(false); }, 3000);
      var opts = {method:'GET', cache:'no-store'};
      if(ctrl) opts.signal = ctrl.signal;
      fetch(url+'/health', opts)
        .then(function(r){ clearTimeout(timer); resolve(r.ok || r.status===404); })
        .catch(function(){ clearTimeout(timer); resolve(false); });
    });
  }

  // 选优：返回该服务当前最佳网关 URL（同步返回，探测异步缓存）
  var bestCache = {};
  var probing = {};
  function pickBest(service){
    var pool = GATEWAY_POOL[service] || [];
    var custom = getCustom(service);
    if(custom) pool = [custom].concat(pool);

    var cached = bestCache[service];
    if(cached && Date.now()-cached.ts < 10*60*1000) return cached.url;

    var fallback = pool[0] || '';
    if(!probing[service]){
      probing[service] = true;
      var results = [];
      pool.forEach(function(url, i){
        test(url).then(function(ok){
          results.push({url:url, ok:ok, idx:i});
          if(results.length===pool.length){
            var best = results.filter(function(r){return r.ok;}).sort(function(a,b){return a.idx-b.idx;})[0];
            if(best){ bestCache[service] = {url:best.url, ts:Date.now()}; }
            probing[service] = false;
          }
        });
      });
    }
    return fallback;
  }

  // 强制重测（设置面板手动触发）
  function refresh(){
    bestCache = {};
    ['api','auth','search'].forEach(function(s){ probing[s]=false; pickBest(s); });
    return Promise.all([
      test(GATEWAY_POOL.api[0]), test(GATEWAY_POOL.api[1]),
      test(GATEWAY_POOL.auth[0]), test(GATEWAY_POOL.auth[1]),
      test(GATEWAY_POOL.search[0]), test(GATEWAY_POOL.search[1])
    ]);
  }

  window.APIGateway = {
    pick: pickBest,
    getCustom: getCustom,
    setCustom: setCustom,
    pool: GATEWAY_POOL,
    refresh: refresh,
    _cache: bestCache,
    _test: test
  };
})();


// ===== 存储 =====
const LS_KEYS={providers:'ai.providers',active:'ai.activeProvider',sessions:'ai.sessions',activeSession:'ai.activeSession',mcp:'ai.mcpServers',plugins:'ai.plugins',builtin:'ai.builtinTools',settings:'ai.settings',activeModel:'ai.activeModel'};

function renderMsgs(){
  const s=curSession();const el=$('msgs');
  if(!s){el.innerHTML='<div class="empty"><div class="big">✦</div><h2>开始一次对话</h2>选择左侧模型，或先添加提供商<br><button class="btn primary" style="margin-top:14px" onclick="newSession()">新对话</button></div>';return}
  el.innerHTML=s.messages.map((m,__i)=>{
    if(m.role==='system')return '';
    if(m._error){return '<div class="msg"><div class="role">系统</div><div class="bubble" style="border-color:var(--danger)">'+esc(m.content||'')+'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn small" onclick="retryLast()">重试</button><button class="btn small primary" onclick="continueLast()">继续生成</button></div></div></div>';}
    if(m.role==='tool'){
      return '<div class="msg"><div class="role">工具 · '+esc(m.name||'')+'</div><div class="bubble" style="background:var(--bg2);font-size:12px;font-family:ui-monospace,monospace;white-space:pre-wrap">'+esc(String(m.content||'').slice(0,2000))+'</div></div>';
    }
    if(m.toolCalls&&m.toolCalls.length){
      const calls=m.toolCalls.map(tc=>'<div class="tool-call">🔧 '+esc(tc.function.name)+'('+esc(JSON.stringify(JSON.parse(tc.function.arguments||'{}')))+')</div>').join('');
      return '<div class="msg"><div class="role">'+esc(m.role)+'</div><div class="bubble">'+calls+'</div></div>';
    }
    let reasoningHtml='';
    if(m.reasoning){reasoningHtml='<details class="reasoning" style="margin-bottom:8px;font-size:12px;color:var(--fg2);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 10px"><summary>🤔 思考过程 ('+Math.round(m.reasoning.length/100)/10+'k 字)</summary><div style="white-space:pre-wrap;margin-top:6px;max-height:300px;overflow-y:auto">'+esc(m.reasoning)+'</div></details>';}
    const bubbleId=m._streaming?' id="streamBubble"':'';
    return '<div class="msg '+(m.role==='user'?'user':'')+'"><div class="role">'+(m.role==='user'?'你':'AI')+'</div><div class="bubble"'+bubbleId+'>'+reasoningHtml+md(m.content||'')+'</div></div>';
  }).join('');
  el.scrollTop=el.scrollHeight;
}
// 简易 Markdown 渲染
function md(t){
  let s=esc(t);
  s=s.replace(/```([\s\S]*?)```/g,(_,c)=>'<pre><code>'+esc(c).replace(/^\w+\n/,'')+'</code></pre>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s=s.replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>');
  s=s.replace(/^- (.*)$/gm,'<li>$1</li>').replace(/^\d+\. (.*)$/gm,'<li>$1</li>');
  s=s.replace(/\n/g,'<br>');
  return s;
}
// 流式期间只重绘当前气泡，避免整表重建卡顿
let _rafPending=false,_streamDirty=false;
function renderStreamThrottled(){
  if(_rafPending)return;
  _rafPending=true;
  requestAnimationFrame(()=>{
    _rafPending=false;
    if(!_streamDirty)return;
    _streamDirty=false;
    patchStreamBubble();
  });
}
function patchStreamBubble(){
  const el=document.getElementById('streamBubble');
  const st=curSession();
  if(!el||!st)return;
  const m=st.messages.find(x=>x.role==='assistant'&&x._streaming);
  if(!m)return;
  let pre='';
  if(m.reasoning){pre='<details class="reasoning" style="margin-bottom:8px;font-size:12px;color:var(--fg2);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 10px"><summary>思考中…</summary><div style="white-space:pre-wrap;margin-top:6px;max-height:300px;overflow-y:auto">'+esc(m.reasoning)+'</div></details>';}
  el.innerHTML=pre+md(m.content||'');
  const box=document.getElementById('msgs');
  if(box)box.scrollTop=box.scrollHeight;
}

function collectTools(){
  const tools=[];
  builtinTools.filter(t=>t.enabled).forEach(t=>{
    if(t.id==='web_search')tools.push({type:'function',function:{name:'web_search',description:'搜索网页，返回相关链接和摘要。参数 query 为搜索关键词。',parameters:{type:'object',properties:{query:{type:'string',description:'搜索关键词'}},required:['query']}}});
    if(t.id==='fetch_url')tools.push({type:'function',function:{name:'fetch_url',description:'抓取指定 URL 的网页文本内容。参数 url 为目标网址。',parameters:{type:'object',properties:{url:{type:'string'}},required:['url']}}});
    if(t.id==='now_time')tools.push({type:'function',function:{name:'now_time',description:'获取当前日期和时间。',parameters:{type:'object',properties:{}}}});
  });
  mcpServers.filter(s=>s.enabled!==false).forEach(s=>{(s.tools||[]).forEach(t=>{
    tools.push({type:'function',function:{name:'mcp_'+s.id+'_'+t.name,description:(t.description||'')+'（通过 MCP 服务器 '+s.name+' 调用）',parameters:t.inputSchema||{type:'object',properties:{}}}});
  });});
  plugins.filter(x=>x.enabled!==false).forEach(x=>{
    if(x.type==='custom'&&x.tool){
      tools.push({type:'function',function:{name:x.tool.name,description:x.tool.desc||'',parameters:tryParse(x.tool.schema)||{type:'object',properties:{}}}});
    }
    if(x.type==='openapi'){
      if(!x._parsedTools){const p=parseOpenapiSpec(x.openapi||'');if(!p.error)x._parsedTools=p.tools;else x._parsedTools=[];}
      x._parsedTools.forEach(t=>{
        tools.push({type:'function',function:{name:t.name,description:t.description||'',parameters:t.parameters||{type:'object',properties:{}}}});
      });
    }
  });
  return tools;
}
// ===== OpenAPI 插件解析与执行 =====
function parseOpenapiSpec(input){
  try{
    const spec=JSON.parse(input.trim());
    const tools=[];
    if(spec.api&&Array.isArray(spec.api)){
      const server=spec.server||spec.gateway||'';
      const baseHeaders=spec.authorization||{};
      spec.api.forEach(a=>{
        if(!a||!a.name)return;
        tools.push({name:a.name,description:a.description||'',method:(a.method||'GET').toUpperCase(),path:a.path||'',server:server,parameters:a.parameters||{type:'object',properties:{}},headers:baseHeaders});
      });
    } else if(spec.paths&&typeof spec.paths==='object'){
      const server=(spec.servers&&spec.servers[0]&&spec.servers[0].url)||'';
      Object.keys(spec.paths).forEach(p=>{
        const ops=spec.paths[p]||{};
        Object.keys(ops).forEach(m=>{
          if(['get','post','put','delete','patch'].indexOf(m)<0)return;
          const op=ops[m];
          if(!op||!op.operationId)return;
          const props={};const required=[];
          (op.parameters||[]).forEach(pp=>{
            props[pp.name]={type:(pp.schema&&pp.schema.type)||'string',description:pp.description||''};
            if(pp.required)required.push(pp.name);
          });
          tools.push({name:op.operationId,description:op.summary||op.description||'',method:m.toUpperCase(),path:p,server:server,parameters:{type:'object',properties:props,required:required},headers:{}});
        });
      });
    }
    return {tools:tools};
  }catch(e){return {error:'解析失败: '+e.message}}
}
async function execOpenapiTool(plugin,name,args){
  try{
    const toolsArr=plugin._parsedTools||[];
    const t=toolsArr.find(x=>x.name===name);
    if(!t)return '未找到工具 '+name;
    let url=(t.server||'').replace(/\/+$/,'')+t.path;
    const headers=Object.assign({'Content-Type':'application/json'},t.headers||{});
    const body={};let query=[];
    Object.keys(args||{}).forEach(k=>{
      const v=encodeURIComponent(String(args[k]));
      if(url.indexOf('{'+k+'}')>=0)url=url.split('{'+k+'}').join(v);
      else if((t.method||'GET')==='GET')query.push(k+'='+v);
      else body[k]=args[k];
    });
    if(query.length)url+='?'+query.join('&');
    const opt={method:t.method||'GET',headers:headers};
    if((t.method||'GET')!=='GET'&&Object.keys(body).length)opt.body=JSON.stringify(body);
    const r=await fetch(url,opt);
    const text=await r.text();
    return String(text).slice(0,6000);
  }catch(e){return '插件调用失败: '+e.message}
}

function tryParse(s){try{return JSON.parse(s)}catch(e){return null}}

// 内置工具执行
async function runTool(name,args){
  if(name==='now_time'){return new Date().toLocaleString('zh-CN',{hour12:false})}
  if(name==='web_search'){
    try{
      const q=encodeURIComponent(args.query||'');
      const r=await fetch(APIGateway.pick('search')+'/search?q='+q+'&format=json');
      const j=await r.json();
      const items=(j.results||j.items||[]).slice(0,8).map(x=>{const t=x.title||'';const u=x.url||x.link||'';const s=x.snippet||x.description||'';return t+' - '+u+'\n'+s}).join('\n\n');
      return items||'未找到结果';
    }catch(e){return '搜索失败: '+e.message}
  }
  if(name==='fetch_url'){
    try{
      const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(args.url||''));
      const t=await r.text();
      return String(t).slice(0,6000);
    }catch(e){return '抓取失败: '+e.message}
  }
  // 自定义插件工具
  const pl=plugins.find(x=>x.enabled!==false&&x.type==='custom'&&x.tool&&x.tool.name===name);
  if(pl&&pl.tool){
    try{
      let url=pl.tool.url||'';
      Object.keys(args||{}).forEach(k=>{url=url.split('{'+k+'}').join(encodeURIComponent(String(args[k])))});
      const hdrs=tryParse(pl.tool.headers)||{};
      const opt={method:pl.tool.method||'GET',headers:hdrs};
      if((pl.tool.method||'GET')==='POST')opt.body=JSON.stringify(args||{});
      const r=await fetch(url,opt);
      const t=await r.text();
      return String(t).slice(0,4000);
    }catch(e){return '插件调用失败: '+e.message}
  }
  // OpenAPI 插件工具
  const opl=plugins.find(x=>x.enabled!==false&&x.type==='openapi'&&x._parsedTools&&x._parsedTools.some(t=>t.name===name));
  if(opl){return await execOpenapiTool(opl,name,args)}
  // MCP 工具
  const mcpMatch=name.match(/^mcp_(.+?)_(.+)$/);
  if(mcpMatch){
    const s=mcpServers.find(x=>x.id===mcpMatch[1]);
    if(s){return await callMcpTool(s,mcpMatch[2],args)}
  }
  return '未知工具: '+name;
}

// ===== MCP 客户端 =====
function mcpHeaders(s){
  const h={'Content-Type':'application/json','Accept':'application/json, text/event-stream'};
  if(s.token)h['Authorization']='Bearer '+s.token;
  const extra=tryParse(s.headers);
  if(extra)Object.assign(h,extra);
  return h;
}
async function loadMcpTools(id){
  const s=mcpServers.find(x=>x.id===id);if(!s)return;
  try{
    const r=await fetch(s.url,{method:'POST',headers:mcpHeaders(s),body:JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'ai-toolbox',version:'1.0.0'}}})});
    const init=await r.json();
    const proto=init.result&&init.result.protocolVersion;
    // 通知服务器已初始化
    try{await fetch(s.url,{method:'POST',headers:mcpHeaders(s),body:JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized'})});}catch(e){}
    const t=await fetch(s.url,{method:'POST',headers:mcpHeaders(s),body:JSON.stringify({jsonrpc:'2.0',id:2,method:'tools/list',params:{}})});
    const tj=await t.json();
    s.tools=(tj.result&&tj.result.tools)||[];
    s.protocol=proto;
    persist();renderToolsModal();updateStatus();toast('已拉取 '+s.tools.length+' 个 MCP 工具');
  }catch(e){toast('MCP 拉取失败: '+e.message)}
}
async function callMcpTool(s,name,args){
  try{
    const r=await fetch(s.url,{method:'POST',headers:mcpHeaders(s),body:JSON.stringify({jsonrpc:'2.0',id:Date.now(),method:'tools/call',params:{name,arguments:args||{}}})});
    const j=await r.json();
    const content=j.result&&j.result.content||[];
    return content.map(c=>c.text||JSON.stringify(c)).join('\n').slice(0,5000);
  }catch(e){return 'MCP 调用失败: '+e.message}
}

// ===== API 请求 =====
// 计算实际请求地址：支持「自带代理 / 内置代理 / 直连」三种模式
function buildUrl(p, endpoint){
  const ep = endpoint || '/chat/completions';
  let base=(p.base||'').replace(/\/+$/,'');
  // 1) 用户自己填了代理地址 -> 优先用它
  if(p.proxy){
    return p.proxy.replace(/\/+$/,'') + ep;
  }
  // 2) 手动或自动启用内置代理
  if(settings.useProxy || needProxyFor(base)){
    const pb=(settings.proxyBase||BUILTIN_PROXY).replace(/\/+$/,'');
    const tgt=encodeURIComponent(base);
    return pb + '/v1' + ep + (ep.includes('?')?'&':'?') + 'target=' + tgt;
  }
  // 3) 直连
  return base + ep;
}
// 代理模式下请求需要携带 X-Target-Base 头（兼容两种代理协议）
function buildHeaders(p){
  const h={'Content-Type':'application/json'};
  if(p.key)h['Authorization']='Bearer '+p.key;
  const base=(p.base||'').replace(/\/+$/,'');
  if(!p.proxy && (settings.useProxy||needProxyFor(base))){
    h['X-Target-Base']=base;
  }
  return h;
}
async function chatOnce(messages,tools){
  const p=activeProvider();
  if(!p||!p.base){throw new Error('未配置提供商')}
  if(!p.key){throw new Error('未设置 API Key')}
  const model=selectedModel||(p.models||[])[0];
  const body={model,messages,temperature:settings.temperature||0.7,max_tokens:settings.maxTokens||2048,stream:false};
  if(tools&&tools.length)body.tools=tools;
  const headers=buildHeaders(p);
  const r=await fetch(buildUrl(p),{method:'POST',headers,body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+': '+t.slice(0,300))}
  return await r.json();
}

// ===== 流式请求 (SSE)，支持 content 与 tool_calls =====
async function chatStreamFull(messages,onDelta){
  const p=activeProvider();
  if(!p||!p.base)throw new Error('未配置提供商');
  if(!p.key)throw new Error('未设置 API Key');
  const model=selectedModel||(p.models||[])[0];
  const body={model:model,messages:messages,temperature:settings.temperature||0.7,max_tokens:settings.maxTokens||2048,stream:true};
  const headers=buildHeaders(p);
  const r=await fetch(buildUrl(p),{method:'POST',headers:headers,body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+': '+t.slice(0,300))}
  const reader=r.body.getReader();
  const dec=new TextDecoder();
  let buf='',full='',reasoning='';
  const toolCalls=[];
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split(String.fromCharCode(10));
    buf=lines.pop()||'';
    for(const line of lines){
      const t=line.trim();
      if(!t.startsWith('data:'))continue;
      const data=t.slice(5).trim();
      if(data==='[DONE]')continue;
      try{
        const j=JSON.parse(data);
        const ch=j.choices&&j.choices[0];
        if(!ch)continue;
        const delta=ch.delta||{};
        if(delta.content){full+=delta.content;if(onDelta)onDelta(full,reasoning)}
        if(delta.reasoning_content){reasoning+=delta.reasoning_content;}
        if(delta.tool_calls){
          delta.tool_calls.forEach(tc=>{
            const idx=tc.index||0;
            if(!toolCalls[idx])toolCalls[idx]={id:tc.id||('call_'+idx),type:'function',function:{name:'',arguments:''}};
            if(tc.id)toolCalls[idx].id=tc.id;
            if(tc.function){
              if(tc.function.name)toolCalls[idx].function.name+=tc.function.name;
              if(tc.function.arguments)toolCalls[idx].function.arguments+=tc.function.arguments;
            }
          });
        }
      }catch(e){}
    }
  }
  return {content:full,reasoning:reasoning,toolCalls:toolCalls.filter(Boolean)};
}

// ===== 对话主循环 =====
let sending=false;
let lastError='';
let stopFlag=false;
async function sendMessage(){
  if(sending)return;
  const inp=$("input");const text=inp.value.trim();
  if(!text){return}
  let s=curSession();
  if(!s){newSession();s=curSession();}
  s.messages.push({role:"user",content:text});
  inp.value="";autoGrow();
  renderMsgs();
  await runCompletion();
}
async function runCompletion(){
  let s=curSession();
  if(!s){newSession();s=curSession();}
  sending=true;$('sendBtn').disabled=true;$('sendBtn').style.display='none';$('stopBtn').style.display='';
  stopFlag=false;
  const p=activeProvider();
  // 只在没有系统消息时插入，避免多次重试重复叠加
  if(p&&p.sys){s.messages=s.messages.filter(m=>m.role!=="system");s.messages.unshift({role:"system",content:p.sys});}
  try{
    const tools=collectTools();
    const msgs=s.messages.filter(m=>m.role!=='system'||m===s.messages[0]);
    let loop=0;
    while(loop<6&&!stopFlag){
      let lastContent='';
      const partial=await chatStreamFull(msgs,(full,reasoningText)=>{
        lastContent=full;
        let existing=s.messages.find(m=>m.role==='assistant'&&m._streaming);
        if(!existing){
          // 首帧：插入占位并全量渲染一次，之后只增量更新气泡
          s.messages.push({role:'assistant',content:full,reasoning:reasoningText||'',_streaming:true});
          if(!s.title||s.title==='新对话'){const first=s.messages.find(m=>m.role==='user');if(first&&first.content)s.title=String(first.content).slice(0,16);}
          renderMsgs();
          const box=$('msgs');if(box)box.scrollTop=box.scrollHeight;
          _streamDirty=true;renderStreamThrottled();
          return;
        }
        existing.content=full;
        if(reasoningText)existing.reasoning=reasoningText;
        _streamDirty=true;
        renderStreamThrottled();
      });
      s.messages=s.messages.filter(m=>!(m._streaming));
      if(partial.content||partial.reasoning){s.messages.push({role:'assistant',content:partial.content||'',reasoning:partial.reasoning||''});}
      const tcs=partial.toolCalls||[];
      if(tcs.length&&!stopFlag){
        s.messages.push({role:'assistant',content:partial.content||'',toolCalls:tcs});
        for(const tc of tcs){
          if(stopFlag)break;
          let args={};try{args=JSON.parse(tc.function.arguments||'{}')}catch(e){}
          const result=await runTool(tc.function.name,args);
          s.messages.push({role:'tool',tool_call_id:tc.id,name:tc.function.name,content:result});
          msgs.push({role:'assistant',content:partial.content||'',tool_calls:tcs});
          msgs.push({role:'tool',tool_call_id:tc.id,name:tc.function.name,content:result});
          renderMsgs();
        }
        loop++;continue;
      }
      break;
    }
  }catch(e){
    const partialMsg=s.messages.find(m=>m.role==='assistant'&&m._streaming);
    const kept=partialMsg?(partialMsg.content||''):'';
    const keptReason=partialMsg?(partialMsg.reasoning||''):'';
    s.messages=s.messages.filter(m=>!(m._streaming));
    if(kept){s.messages.push({role:'assistant',content:kept,reasoning:keptReason});}
    const raw=String((e&&e.message)||e||'未知错误');
    const kind=/HTTP 401|HTTP 403|未设置 API Key|未配置/.test(raw)?'配置错误':(/(500|502|503|504|Failed to fetch|NetworkError|ECONNRESET|timeout|超时)/i.test(raw)?'网络或服务异常':'其他错误');
    s.messages.push({role:'assistant',content:'⚠️ '+kind+'：'+raw,_error:true});
    lastError=raw;
  }
  sending=false;$('sendBtn').disabled=false;stopFlag=false;$('sendBtn').style.display='';$('stopBtn').style.display='none';
  renderMsgs();persist();
}

// 重试：删掉错误卡片，用相同历史再请求一次
async function retryLast(){
  const st=curSession();
  if(!st||sending)return;
  for(let i=st.messages.length-1;i>=0;i--){if(st.messages[i]._error){st.messages.splice(i,1);break}}
  renderMsgs();
  await runCompletion();
}
// 继续：保留已生成内容，追加继续指令
async function continueLast(){
  const st=curSession();
  if(!st||sending)return;
  for(let i=st.messages.length-1;i>=0;i--){if(st.messages[i]._error){st.messages.splice(i,1);break}}
  st.messages.push({role:'user',content:'请从上次中断处继续，不要重复已输出的内容。'});
  renderMsgs();
  await runCompletion();
}
$('sendBtn').onclick=sendMessage;
$('stopBtn').onclick=()=>{stopFlag=true;};
$('sendBtn').onclick=sendMessage;
$('input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});
function autoGrow(){const i=$('input');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,160)+'px';}
$('input').addEventListener('input',autoGrow);
$('menuBtn').onclick=()=>{$('sidebar').classList.add('open');$('sbBackdrop').classList.add('open');};
$('sbBackdrop').onclick=()=>{$('sidebar').classList.remove('open');$('sbBackdrop').classList.remove('open');};

  $('setTemp').value=settings.temperature||0.7;$('tempVal').textContent=settings.temperature||0.7;
  $('setMaxTokens').value=settings.maxTokens||2048;

};
$('setTemp').oninput=()=>{$('tempVal').textContent=$('setTemp').value};
$('settingsCancel').onclick=()=>$('settingsModal').classList.remove('open');
// ===== 数据导出 / 导入 / 清空 =====
$('btnExport').onclick=()=>{
  const data={version:1,exported:new Date().toISOString(),providers:providers,activeProviderId:activeProviderId,sessions:sessions,activeSessionId:activeSessionId,mcpServers:mcpServers,plugins:plugins,builtinTools:builtinTools,settings:settings};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-toolbox-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('已导出备份');
};
$('btnImport').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(d.providers)providers=d.providers;
      if(d.activeProviderId)activeProviderId=d.activeProviderId;
      if(d.sessions)sessions=d.sessions;
      if(d.activeSessionId)activeSessionId=d.activeSessionId;
      if(d.mcpServers)mcpServers=d.mcpServers;
      if(d.plugins)plugins=d.plugins;
      if(d.builtinTools)builtinTools=d.builtinTools;
      if(d.settings)settings=Object.assign(settings,d.settings);
      persist();renderAll();toast('✓ 导入成功');
    }catch(err){toast('✗ 导入失败: '+err.message)}
  };
  reader.readAsText(f);e.target.value='';
};
$('btnWipe').onclick=()=>{
  if(!confirm('确定清空全部数据？此操作不可撤销！'))return;
  localStorage.clear();location.reload();
};
$('settingsSave').onclick=()=>{
  settings.temperature=parseFloat($('setTemp').value)||0.7;
  settings.maxTokens=parseInt($('setMaxTokens').value)||2048;
  settings.useProxy=$('setUseProxy').checked;
  settings.proxyBase=$('setProxyBase').value.trim()||BUILTIN_PROXY;
  persist();$('settingsModal').classList.remove('open');toast('设置已保存');
};

document.querySelectorAll('.tabs').forEach(bar=>{
  bar.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    const modal=bar.closest('.modal');
    bar.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
