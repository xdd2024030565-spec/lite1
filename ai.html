<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f7;--fg:#1a1a1a;--fg2:#86868b;--border:#d2d2d7;--accent:#0071e3;--accent-bg:rgba(0,113,227,.08);--radius:12px;--maxw:720px;--ease:cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#000;--bg2:#1c1c1e;--fg:#f5f5f7;--fg2:#86868b;--border:#38383a;--accent:#0a84ff;--accent-bg:rgba(10,132,255,.15)}}
:root[data-theme=dark]{--bg:#000;--bg2:#1c1c1e;--fg:#f5f5f7;--fg2:#86868b;--border:#38383a;--accent:#0a84ff;--accent-bg:rgba(10,132,255,.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;font-size:1rem;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.container{max-width:var(--maxw);width:100%;text-align:center}
.icon{font-size:3rem;margin-bottom:16px}
.title{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.subtitle{font-size:1rem;color:var(--fg2);margin-bottom:32px}
.back-link{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--fg);text-decoration:none;font-weight:600;transition:all .2s var(--ease)}
.back-link:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
</style>
</head>
<body>
<div class="container">
<div class="icon">🤖</div>
<h1 class="title">AI</h1>
<p class="subtitle">功能开发中，敬请期待</p>
<a class="back-link" href="index.html">← 返回首页</a>
</div>
</body>
</html>
